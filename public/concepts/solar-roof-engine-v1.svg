<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="820"
  viewBox="0 0 1100 820"
  role="img"
  aria-labelledby="solar-roof-engine-title solar-roof-engine-desc"
>
  <title id="solar-roof-engine-title">Solar roof engine</title>
  <desc id="solar-roof-engine-desc">
    An abstract axonometric South Indian home with a rooftop solar array,
    surrounded by a dithered solar field and a restrained electricity path.
  </desc>

  <defs>
    <linearGradient id="sun-disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8d7"/>
      <stop offset=".58" stop-color="#f1d36f"/>
      <stop offset="1" stop-color="#e5a83c"/>
    </linearGradient>

    <linearGradient id="panel-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2340"/>
      <stop offset=".52" stop-color="#114d91"/>
      <stop offset="1" stop-color="#07182d"/>
    </linearGradient>

    <linearGradient id="wall-front" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#d9d5c7"/>
    </linearGradient>

    <linearGradient id="wall-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d4c8"/>
      <stop offset="1" stop-color="#aaa99f"/>
    </linearGradient>

    <linearGradient id="energy-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78b7ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#2379ff"/>
      <stop offset="1" stop-color="#78b7ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="field-fade">
      <stop offset="0" stop-color="white"/>
      <stop offset=".68" stop-color="white" stop-opacity=".84"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dither-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2.2" fill="#2379ff"/>
      <circle cx="10.5" cy="10.5" r="1.1" fill="#2379ff" opacity=".7"/>
    </pattern>

    <pattern id="panel-cells" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#8dc1ff" stroke-width="1" opacity=".48"/>
      <circle cx="9" cy="9" r="1.3" fill="#b9d8ff" opacity=".55"/>
    </pattern>

    <mask id="field-mask">
      <circle cx="765" cy="300" r="278" fill="url(#field-fade)"/>
    </mask>

    <clipPath id="panel-array-clip">
      <rect x="0" y="0" width="414" height="180" rx="8"/>
    </clipPath>

    <filter id="house-shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#0f1512" flood-opacity=".2"/>
    </filter>

    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker
      id="energy-arrow"
      markerWidth="14"
      markerHeight="14"
      refX="12"
      refY="7"
      orient="auto"
      markerUnits="userSpaceOnUse"
    >
      <path d="M0 0L14 7L0 14Z" fill="#2379ff"/>
    </marker>
  </defs>

  <style>
    .linework {
      fill: none;
      stroke: #121815;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fine-line {
      fill: none;
      stroke: #121815;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw-in {
      stroke-dasharray: 1600;
      stroke-dashoffset: 0;
      animation: draw-in 1.15s cubic-bezier(.22, 1, .36, 1) .08s forwards;
    }

    #sun-field {
      opacity: 1;
      transform-origin: 765px 300px;
      animation: field-enter 1.1s cubic-bezier(.22, 1, .36, 1) .45s forwards;
    }

    #panel-matrix {
      opacity: 1;
      animation: panels-enter .8s cubic-bezier(.22, 1, .36, 1) .62s forwards;
    }

    #energy-path {
      stroke-dasharray: 12 16;
      animation: energy-travel 3.8s linear 1.45s infinite;
    }

    #orbit-a {
      animation: orbit-drift 14s ease-in-out infinite alternate;
      transform-origin: 765px 300px;
    }

    #orbit-b {
      animation: orbit-drift 18s ease-in-out infinite alternate-reverse;
      transform-origin: 765px 300px;
    }

    .node {
      transform-origin: center;
      animation: node-breathe 3.2s ease-in-out infinite;
    }

    @keyframes draw-in {
      from { stroke-dashoffset: 1600; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes field-enter {
      from { opacity: 0; transform: scale(.9) rotate(-3deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes panels-enter {
      from { opacity: 0; filter: brightness(1.8); }
      to { opacity: 1; filter: brightness(1); }
    }

    @keyframes energy-travel {
      to { stroke-dashoffset: -56; }
    }

    @keyframes orbit-drift {
      from { transform: rotate(-1.2deg); }
      to { transform: rotate(1.2deg); }
    }

    @keyframes node-breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw-in,
      #sun-field,
      #panel-matrix,
      #energy-path,
      #orbit-a,
      #orbit-b,
      .node {
        animation: none;
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <g id="sun-field">
    <circle cx="765" cy="300" r="214" fill="url(#sun-disc)" opacity=".95"/>
    <circle cx="765" cy="300" r="278" fill="url(#dither-dots)" mask="url(#field-mask)" opacity=".9"/>

    <ellipse
      id="orbit-a"
      cx="765"
      cy="300"
      rx="326"
      ry="168"
      fill="none"
      stroke="#121815"
      stroke-width="1.5"
      stroke-dasharray="3 12"
      opacity=".58"
      transform="rotate(-13 765 300)"
    />
    <ellipse
      id="orbit-b"
      cx="765"
      cy="300"
      rx="252"
      ry="326"
      fill="none"
      stroke="#2379ff"
      stroke-width="2"
      stroke-dasharray="26 11 3 11"
      opacity=".52"
      transform="rotate(32 765 300)"
    />

    <circle class="node" cx="466" cy="402" r="7" fill="#2379ff"/>
    <circle class="node" cx="960" cy="114" r="6" fill="#121815" style="animation-delay:.5s"/>
    <circle class="node" cx="1021" cy="393" r="9" fill="#2379ff" style="animation-delay:1s"/>
    <circle cx="467" cy="402" r="17" fill="none" stroke="#2379ff" stroke-width="1.5" opacity=".45"/>
    <circle cx="1021" cy="393" r="22" fill="none" stroke="#2379ff" stroke-width="1.5" opacity=".34"/>
  </g>

  <g id="technical-lines" opacity=".74">
    <path d="M92 238H360L438 294" class="fine-line" stroke-dasharray="4 10"/>
    <circle cx="92" cy="238" r="6" fill="#121815"/>
    <path d="M1001 606H969L906 570" class="fine-line" stroke-dasharray="4 10"/>
    <circle cx="1001" cy="606" r="6" fill="#2379ff"/>
    <path d="M126 704H248" class="fine-line"/>
    <path d="M126 716H207" class="fine-line" opacity=".45"/>
  </g>

  <g id="solar-home" filter="url(#house-shadow)">
    <path
      d="M270 423L647 307L929 433L689 559L270 457Z"
      fill="#e9e4d6"
      stroke="#121815"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <path
      d="M290 450L687 548V742L290 638Z"
      fill="url(#wall-front)"
      stroke="#121815"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <path
      d="M687 548L915 426V628L687 742Z"
      fill="url(#wall-side)"
      stroke="#121815"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <path d="M290 450L687 548L915 426" class="linework draw-in"/>
    <path d="M290 638L687 742L915 628" class="linework draw-in"/>
    <path d="M687 548V742" class="linework draw-in"/>

    <g id="front-openings">
      <path d="M355 526L455 551V662L355 636Z" fill="#12233c" stroke="#121815" stroke-width="3"/>
      <path d="M369 544L441 562V642L369 623Z" fill="#8cc4ff" opacity=".45"/>
      <path d="M513 568L604 591V720L513 696Z" fill="#1b2822" stroke="#121815" stroke-width="3"/>
      <circle cx="585" cy="651" r="4" fill="#f1d36f"/>
      <path d="M329 492L626 566" class="fine-line" opacity=".42"/>
    </g>

    <g id="side-openings">
      <path d="M754 555L843 507V610L754 657Z" fill="#18335a" stroke="#121815" stroke-width="3"/>
      <path d="M765 563L831 528V596L765 631Z" fill="#8cc4ff" opacity=".35"/>
      <path d="M873 503L897 491V563L873 575Z" fill="#1c2823" stroke="#121815" stroke-width="2"/>
    </g>

    <g id="water-tank">
      <ellipse cx="790" cy="354" rx="45" ry="18" fill="#202823" stroke="#121815" stroke-width="3"/>
      <path d="M745 354V410C745 420 765 428 790 428C815 428 835 420 835 410V354" fill="#333d37" stroke="#121815" stroke-width="3"/>
      <ellipse cx="790" cy="410" rx="45" ry="18" fill="#29332d" stroke="#121815" stroke-width="3"/>
      <path d="M756 377H824M756 391H824" stroke="#657169" stroke-width="2"/>
    </g>

    <g id="meter">
      <path d="M902 551L934 534V580L902 597Z" fill="#f6f1df" stroke="#121815" stroke-width="2.5"/>
      <circle cx="918" cy="563" r="8" fill="#dbe9ff" stroke="#2379ff" stroke-width="2"/>
      <path d="M918 571V604" class="fine-line"/>
    </g>

    <g id="panel-matrix" transform="matrix(1 -.31 .55 .28 337 411)">
      <rect x="-14" y="-14" width="442" height="208" rx="10" fill="#121815" opacity=".16"/>
      <g clip-path="url(#panel-array-clip)">
        <rect width="414" height="180" fill="url(#panel-face)"/>
        <rect width="414" height="180" fill="url(#panel-cells)"/>
      </g>

      <g fill="none" stroke="#b8d9ff" stroke-width="3" opacity=".95">
        <rect x="0" y="0" width="99" height="84" rx="3"/>
        <rect x="105" y="0" width="99" height="84" rx="3"/>
        <rect x="210" y="0" width="99" height="84" rx="3"/>
        <rect x="315" y="0" width="99" height="84" rx="3"/>
        <rect x="0" y="90" width="99" height="90" rx="3"/>
        <rect x="105" y="90" width="99" height="90" rx="3"/>
        <rect x="210" y="90" width="99" height="90" rx="3"/>
        <rect x="315" y="90" width="99" height="90" rx="3"/>
      </g>

      <path d="M14 10H188" stroke="white" stroke-width="4" stroke-linecap="round" opacity=".45"/>
    </g>

    <path
      d="M538 490C600 511 664 542 715 570C771 600 837 603 919 563"
      id="energy-path"
      fill="none"
      stroke="url(#energy-line)"
      stroke-width="7"
      stroke-linecap="round"
      marker-end="url(#energy-arrow)"
      filter="url(#soft-glow)"
    />
  </g>

  <g id="foreground-geometry" opacity=".82">
    <path d="M42 561L160 524L253 566L135 605Z" fill="none" stroke="#2379ff" stroke-width="2"/>
    <path d="M42 561V602L135 644V605M135 605L253 566V606L135 644" class="fine-line"/>
    <path d="M56 576L135 611L235 579" fill="none" stroke="#2379ff" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="54" cy="578" r="5" fill="#2379ff"/>
  </g>
</svg>
