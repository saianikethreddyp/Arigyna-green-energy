<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arignya modern Deccan home hero concept</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f1e8;
        color: #121a17;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f4f1e8;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        display: flex;
        align-items: center;
        padding: clamp(86px, 10vh, 120px) clamp(24px, 5vw, 84px) clamp(44px, 6vh, 72px);
      }

      .hero-art {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .copy {
        width: min(42vw, 650px);
        margin-top: -2vh;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #315b4d;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 650px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(56px, 6.5vw, 108px);
        font-weight: 500;
        letter-spacing: -.068em;
        line-height: .9;
      }

      h1 span {
        color: #0e68bc;
      }

      .subcopy {
        max-width: 520px;
        margin: 28px 0 0;
        color: #535a56;
        font-size: clamp(17px, 1.28vw, 21px);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      button {
        min-height: 52px;
        border: 1px solid #17211d;
        border-radius: 999px;
        padding: 0 22px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: #17211d;
        color: #fff;
      }

      .secondary {
        background: rgba(244, 241, 232, .7);
        color: #17211d;
        backdrop-filter: blur(8px);
      }

      .replay {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 2;
        min-height: 42px;
        padding: 0 17px;
        border-color: rgba(23, 33, 29, .25);
        background: rgba(244, 241, 232, .78);
        color: #17211d;
        font-size: 14px;
        backdrop-filter: blur(10px);
      }

      @media (max-width: 900px) {
        .hero {
          min-height: 100svh;
          align-items: flex-start;
          padding: 88px 22px 0;
        }

        .copy {
          width: 100%;
          margin: 0;
        }

        h1 {
          max-width: 590px;
          font-size: clamp(50px, 15vw, 78px);
        }

        .subcopy {
          max-width: 470px;
          margin-top: 20px;
        }

        .hero-art {
          top: auto;
          bottom: -2%;
          width: 154%;
          height: 59%;
          max-width: none;
          object-fit: cover;
          object-position: 73% center;
        }

        .replay {
          right: 14px;
          bottom: 14px;
        }
      }

      @media (max-width: 560px) {
        .hero {
          padding-top: 70px;
        }

        .eyebrow {
          margin-bottom: 14px;
          font-size: 11px;
        }

        .subcopy {
          font-size: 16px;
        }

        .actions {
          margin-top: 24px;
        }

        button {
          min-height: 48px;
          padding: 0 18px;
          font-size: 14px;
        }

        .hero-art {
          bottom: 0;
          width: 176%;
          height: 51%;
          object-position: 76% center;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <img
        class="hero-art"
        id="hero-art"
        src="./modern-deccan-solar-home-v5.svg"
        alt="A contemporary Indian duplex powers on as solar panels unfold on its terrace"
      />

      <section class="copy">
        <p class="eyebrow">Residential rooftop solar</p>
        <h1>Turn your roof into <span>Zero electricity bills</span></h1>
        <p class="subcopy">
          Complete rooftop solar support, from system design and installation to
          net-metering and subsidy assistance.
        </p>
        <div class="actions">
          <button class="primary" type="button">View solar packages</button>
          <button class="secondary" type="button">View solar packages</button>
        </div>
      </section>

      <button class="replay" id="replay" type="button">Replay animation</button>
    </main>

    <script>
      const replayButton = document.querySelector("#replay");
      const heroArt = document.querySelector("#hero-art");

      replayButton.addEventListener("click", () => {
        heroArt.src = `./modern-deccan-solar-home-v5.svg?replay=${Date.now()}`;
      });
    </script>
  </body>
</html>
