<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="800"
  viewBox="0 0 1600 800"
  role="img"
  aria-labelledby="deccan-home-title deccan-home-desc"
>
  <title id="deccan-home-title">Modern Deccan solar home</title>
  <desc id="deccan-home-desc">
    A contemporary Indian duplex with a shaded balcony, terracotta jaali,
    rooftop solar panels and a glowing light inside.
  </desc>

  <defs>
    <radialGradient id="v5-sun" cx=".36" cy=".3" r=".76">
      <stop offset="0" stop-color="#fffdeb"/>
      <stop offset=".5" stop-color="#f9df83"/>
      <stop offset="1" stop-color="#efb33b"/>
    </radialGradient>

    <linearGradient id="v5-plaster" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ded8ca"/>
    </linearGradient>

    <linearGradient id="v5-plaster-shade" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#e4ded1"/>
      <stop offset="1" stop-color="#bcb8ae"/>
    </linearGradient>

    <linearGradient id="v5-roof" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f6f1e5"/>
      <stop offset="1" stop-color="#cec8ba"/>
    </linearGradient>

    <linearGradient id="v5-terracotta" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#c8744f"/>
      <stop offset="1" stop-color="#8f3f2a"/>
    </linearGradient>

    <linearGradient id="v5-glass-cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7da8ca"/>
      <stop offset=".3" stop-color="#315d82"/>
      <stop offset="1" stop-color="#0a2339"/>
    </linearGradient>

    <linearGradient id="v5-glass-warm" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f9dda0"/>
      <stop offset=".48" stop-color="#c89548"/>
      <stop offset="1" stop-color="#543719"/>
    </linearGradient>

    <linearGradient id="v5-panel" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#071d38"/>
      <stop offset=".42" stop-color="#0b56a6"/>
      <stop offset=".72" stop-color="#1479df"/>
      <stop offset="1" stop-color="#06182f"/>
    </linearGradient>

    <linearGradient id="v5-ray" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdb6d" stop-opacity=".68"/>
      <stop offset="1" stop-color="#ffdb6d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="v5-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="v5-sun-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.45" fill="#1771c8" opacity=".4"/>
    </pattern>

    <radialGradient id="v5-dot-mask-gradient">
      <stop offset=".57" stop-color="#000" stop-opacity="0"/>
      <stop offset=".82" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>

    <mask id="v5-dot-mask">
      <circle cx="1305" cy="213" r="274" fill="url(#v5-dot-mask-gradient)"/>
    </mask>

    <pattern id="v5-jaali-pattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#a84f35"/>
      <path
        d="M14 3L25 14L14 25L3 14Z"
        fill="#6f3022"
      />
      <circle cx="14" cy="14" r="4.8" fill="#e7b08f"/>
    </pattern>

    <filter id="v5-home-shadow" x="-30%" y="-35%" width="170%" height="220%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#10223a" flood-opacity=".18"/>
    </filter>

    <filter id="v5-small-shadow" x="-35%" y="-45%" width="180%" height="230%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#10223a" flood-opacity=".18"/>
    </filter>

    <filter id="v5-bulb-glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>

    <clipPath id="v5-main-window-clip">
      <path d="M1138 566L1398 545V689L1138 713Z"/>
    </clipPath>

    <clipPath id="v5-array-clip">
      <path d="M0 59L508 0L585 58L74 122Z"/>
    </clipPath>
  </defs>

  <style>
    #v5-scene {
      --v5-out: cubic-bezier(.22, 1, .36, 1);
    }

    #v5-sun-field {
      transform-origin: 1305px 213px;
      animation: v5-sun-in 760ms var(--v5-out) both;
    }

    #v5-ground {
      transform-origin: 1110px 750px;
      animation: v5-ground-in 760ms var(--v5-out) 80ms both;
    }

    #v5-ground-floor {
      animation: v5-plane-in 720ms var(--v5-out) 140ms both;
    }

    #v5-upper-floor {
      animation: v5-plane-in 720ms var(--v5-out) 270ms both;
    }

    #v5-jaali-tower {
      animation: v5-tower-in 720ms var(--v5-out) 390ms both;
    }

    #v5-balcony,
    #v5-entrance-canopy {
      animation: v5-canopy-in 620ms var(--v5-out) 520ms both;
    }

    .v5-panel {
      transform-box: fill-box;
      transform-origin: center;
      animation: v5-panel-pop 650ms cubic-bezier(.16, 1.22, .3, 1) both;
    }

    .v5-panel:nth-child(1) { animation-delay: 720ms; }
    .v5-panel:nth-child(2) { animation-delay: 790ms; }
    .v5-panel:nth-child(3) { animation-delay: 860ms; }
    .v5-panel:nth-child(4) { animation-delay: 930ms; }
    .v5-panel:nth-child(5) { animation-delay: 1000ms; }
    .v5-panel:nth-child(6) { animation-delay: 1070ms; }

    #v5-rays {
      transform-origin: 1220px 310px;
      animation: v5-rays-in 680ms var(--v5-out) 1210ms both;
    }

    #v5-array-flash {
      animation: v5-array-flash 600ms ease-out 1450ms both;
    }

    #v5-main-window-light {
      animation: v5-window-warm 560ms ease-out 1590ms both;
    }

    #v5-bulb-aura {
      transform-origin: 1268px 634px;
      animation: v5-aura-in 720ms ease-out 1710ms both;
    }

    #v5-bulb-fill {
      animation: v5-bulb-flicker 610ms steps(1, end) 1690ms both;
    }

    #v5-panel-glint {
      animation: v5-glint 8.8s cubic-bezier(.4, 0, .2, 1) 2.9s infinite;
    }

    @keyframes v5-sun-in {
      from { opacity: 0; transform: translateY(16px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes v5-ground-in {
      from { opacity: 0; transform: scaleX(.84); }
      to { opacity: 1; transform: scaleX(1); }
    }

    @keyframes v5-plane-in {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes v5-tower-in {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes v5-canopy-in {
      from { opacity: 0; transform: translateY(-9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes v5-panel-pop {
      0% { opacity: 0; transform: translateY(-32px) rotate(-5deg) scale(.58); }
      64% { opacity: 1; transform: translateY(3px) rotate(.8deg) scale(1.045); }
      82% { transform: translateY(-2px) rotate(-.25deg) scale(.985); }
      100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }

    @keyframes v5-rays-in {
      from { opacity: 0; transform: translate(22px, -16px) scale(.92); }
      to { opacity: .7; transform: translate(0, 0) scale(1); }
    }

    @keyframes v5-array-flash {
      0% { opacity: 0; }
      36% { opacity: .72; }
      100% { opacity: 0; }
    }

    @keyframes v5-window-warm {
      from { opacity: 0; }
      to { opacity: .78; }
    }

    @keyframes v5-aura-in {
      0% { opacity: 0; transform: scale(.45); }
      30% { opacity: .9; transform: scale(1.08); }
      43% { opacity: .12; transform: scale(.84); }
      58% { opacity: .84; transform: scale(1.04); }
      100% { opacity: .7; transform: scale(1); }
    }

    @keyframes v5-bulb-flicker {
      0% { fill: #d8dde1; }
      28% { fill: #fff5c6; }
      40% { fill: #d8dde1; }
      56%, 100% { fill: #fff4b8; }
    }

    @keyframes v5-glint {
      0%, 71% { opacity: 0; transform: translateX(-220px); }
      77% { opacity: .58; }
      87%, 100% { opacity: 0; transform: translateX(650px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #v5-sun-field,
      #v5-ground,
      #v5-ground-floor,
      #v5-upper-floor,
      #v5-jaali-tower,
      #v5-balcony,
      #v5-entrance-canopy,
      .v5-panel,
      #v5-rays,
      #v5-array-flash,
      #v5-main-window-light,
      #v5-bulb-aura,
      #v5-bulb-fill,
      #v5-panel-glint {
        animation: none;
        opacity: 1;
        transform: none;
      }

      #v5-array-flash,
      #v5-panel-glint {
        opacity: 0;
      }

      #v5-rays { opacity: .7; }
      #v5-main-window-light { opacity: .78; }
      #v5-bulb-aura { opacity: .7; }
      #v5-bulb-fill { fill: #fff4b8; }
    }
  </style>

  <g id="v5-scene">
    <g id="v5-sun-field">
      <circle cx="1305" cy="213" r="215" fill="url(#v5-sun)"/>
      <circle
        cx="1305"
        cy="213"
        r="274"
        fill="url(#v5-sun-dots)"
        mask="url(#v5-dot-mask)"
        opacity=".72"
      />
    </g>

    <g id="v5-rays" opacity="0">
      <path d="M1204 275L1263 283L1145 391L1081 382Z" fill="url(#v5-ray)"/>
      <path d="M1295 282L1351 303L1260 400L1199 383Z" fill="url(#v5-ray)" opacity=".84"/>
      <path d="M1380 317L1421 349L1365 419L1317 392Z" fill="url(#v5-ray)" opacity=".62"/>
    </g>

    <g id="v5-ground">
      <ellipse cx="1110" cy="748" rx="470" ry="44" fill="#214f7a" opacity=".12"/>
      <ellipse cx="1148" cy="741" rx="338" ry="26" fill="#081c33" opacity=".11"/>
    </g>

    <g id="v5-home" filter="url(#v5-home-shadow)">
      <g id="v5-ground-floor">
        <path
          d="M690 510L1378 451L1500 498L807 562Z"
          fill="url(#v5-roof)"
        />
        <path
          d="M807 562L1500 498V712L807 782Z"
          fill="url(#v5-plaster-shade)"
        />
        <path
          d="M690 510L807 562V782L690 728Z"
          fill="url(#v5-plaster)"
        />

        <path d="M1062 572L1413 539V694L1062 728Z" fill="#092139"/>
        <path d="M1078 577L1398 547V687L1078 718Z" fill="url(#v5-glass-cool)"/>
        <path
          id="v5-main-window-light"
          d="M1078 577L1398 547V687L1078 718Z"
          fill="url(#v5-glass-warm)"
          opacity="0"
        />

        <g clip-path="url(#v5-main-window-clip)" opacity=".48">
          <path d="M1185 554V714M1292 545V702" fill="none" stroke="#a9c7df" stroke-width="6"/>
          <path d="M1096 702L1382 674" fill="none" stroke="#f3dfae" stroke-width="3" opacity=".45"/>
        </g>

        <path d="M842 584L1012 568V745L842 762Z" fill="#102821"/>
        <path d="M859 603L994 590V724L859 738Z" fill="#183a2f"/>
        <rect x="924" y="646" width="7" height="7" rx="3.5" fill="#efc259" transform="rotate(-5 927.5 649.5)"/>

        <g id="v5-entrance-canopy" filter="url(#v5-small-shadow)">
          <path d="M807 565L1018 545L1066 564L852 586Z" fill="#17324c"/>
          <path d="M852 586L1066 564V579L852 602Z" fill="#091c31"/>
        </g>
      </g>

      <g id="v5-upper-floor">
        <path d="M790 300L1298 252L1434 302L919 355Z" fill="url(#v5-roof)"/>
        <path d="M919 355L1434 302V521L919 579Z" fill="url(#v5-plaster)"/>
        <path d="M790 300L919 355V579L790 522Z" fill="#eee9df"/>

        <path d="M1034 380L1386 345V480L1034 518Z" fill="#0a223a"/>
        <path d="M1050 385L1371 353V473L1050 507Z" fill="url(#v5-glass-cool)"/>
        <path d="M1160 373V496M1270 362V485" fill="none" stroke="#8db2cf" stroke-width="6" opacity=".44"/>

        <path d="M1015 355L1402 315" fill="none" stroke="#fffdf7" stroke-width="7" opacity=".78"/>

        <g id="v5-balcony">
          <path d="M1002 490L1404 448V479L1002 523Z" fill="#f6f1e5"/>
          <path d="M1002 523L1404 479V495L1002 540Z" fill="#bcb7ab"/>
          <path d="M1038 491V521M1144 480V510M1251 469V498M1357 458V486" fill="none" stroke="#334853" stroke-width="4" opacity=".78"/>
          <path d="M1020 497L1387 458" fill="none" stroke="#334853" stroke-width="4" opacity=".78"/>
        </g>
      </g>

      <g id="v5-jaali-tower">
        <path d="M760 331L912 316V637L760 653Z" fill="url(#v5-terracotta)"/>
        <path d="M782 352L891 341V608L782 620Z" fill="url(#v5-jaali-pattern)"/>
        <path d="M744 322L913 306V326L744 343Z" fill="#efe9dd"/>
        <path d="M744 343L760 350V653L744 646Z" fill="#d1cbbf"/>
      </g>

      <path d="M661 731L1510 645V724L661 799Z" fill="#252e2c" opacity=".12"/>

      <g id="v5-solar-array" transform="translate(845 211)" filter="url(#v5-small-shadow)">
        <path d="M-12 57L513 -5L600 61L73 132Z" fill="#091a2d" opacity=".17" transform="translate(5 8)"/>

        <g class="v5-panel">
          <g transform="translate(0 18)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>
        <g class="v5-panel">
          <g transform="translate(157 0)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>
        <g class="v5-panel">
          <g transform="translate(314 -18)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>
        <g class="v5-panel">
          <g transform="translate(38 70)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>
        <g class="v5-panel">
          <g transform="translate(195 52)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>
        <g class="v5-panel">
          <g transform="translate(352 34)">
            <path d="M0 42L151 25L188 53L36 72Z" fill="url(#v5-panel)" stroke="#b9d9f4" stroke-width="3"/>
            <path d="M50 36L62 69M100 31L112 63M18 58L169 41" fill="none" stroke="#91c4ef" stroke-width="1" opacity=".58"/>
          </g>
        </g>

        <g clip-path="url(#v5-array-clip)">
          <rect
            id="v5-panel-glint"
            x="-220"
            y="-45"
            width="112"
            height="220"
            fill="url(#v5-glint)"
            transform="rotate(-8)"
          />
        </g>
      </g>

      <path
        id="v5-array-flash"
        d="M845 270L1353 211L1430 269L919 333Z"
        fill="url(#v5-glint)"
        opacity="0"
      />

      <g id="v5-bulb">
        <path d="M1268 565V604" fill="none" stroke="#273137" stroke-width="4"/>
        <circle
          id="v5-bulb-aura"
          cx="1268"
          cy="634"
          r="45"
          fill="#ffd866"
          opacity="0"
          filter="url(#v5-bulb-glow)"
        />
        <path
          id="v5-bulb-fill"
          d="M1252 624C1252 614 1259 607 1268 607C1277 607 1284 614 1284 624C1284 631 1280 636 1276 640V649H1260V640C1256 636 1252 631 1252 624Z"
          fill="#d8dde1"
          stroke="#273137"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <path d="M1261 655H1275M1263 661H1273" fill="none" stroke="#273137" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
