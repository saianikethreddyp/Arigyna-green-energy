<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="760"
  viewBox="0 0 1600 760"
  role="img"
  aria-labelledby="solar-pavilion-title solar-pavilion-desc"
>
  <title id="solar-pavilion-title">Solar pavilion</title>
  <desc id="solar-pavilion-desc">
    A wide architectural solar home formed from two offset wings beneath a warm sun.
  </desc>

  <defs>
    <radialGradient id="sun-core" cx=".38" cy=".32" r=".72">
      <stop offset="0" stop-color="#fffce9"/>
      <stop offset=".48" stop-color="#f9df83"/>
      <stop offset="1" stop-color="#efb538"/>
    </radialGradient>

    <linearGradient id="roof-main" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#f5f1e6"/>
      <stop offset="1" stop-color="#d8d3c4"/>
    </linearGradient>

    <linearGradient id="wall-main" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ece8dd"/>
      <stop offset="1" stop-color="#c7c4bb"/>
    </linearGradient>

    <linearGradient id="wall-light" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ddd9cd"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bbef1"/>
      <stop offset=".25" stop-color="#2d6da9"/>
      <stop offset=".75" stop-color="#0b315b"/>
      <stop offset="1" stop-color="#061a32"/>
    </linearGradient>

    <linearGradient id="panel-blue" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#0a294e"/>
      <stop offset=".42" stop-color="#0c62bd"/>
      <stop offset=".72" stop-color="#1479df"/>
      <stop offset="1" stop-color="#071c38"/>
    </linearGradient>

    <linearGradient id="panel-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="sun-grain" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.55" fill="#116fd0" opacity=".48"/>
    </pattern>

    <radialGradient id="grain-mask-gradient">
      <stop offset=".56" stop-color="#000" stop-opacity="0"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>

    <mask id="grain-mask">
      <circle cx="1270" cy="225" r="292" fill="url(#grain-mask-gradient)"/>
    </mask>

    <clipPath id="array-clip">
      <path d="M0 44L460 0L538 74L76 124Z"/>
    </clipPath>

    <filter id="home-shadow" x="-30%" y="-35%" width="170%" height="210%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#17253b" flood-opacity=".18"/>
    </filter>

    <filter id="small-shadow" x="-30%" y="-40%" width="170%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#17253b" flood-opacity=".16"/>
    </filter>
  </defs>

  <style>
    #sun-field {
      transform-origin: 1270px 225px;
      animation: sun-arrive 850ms cubic-bezier(.22, 1, .36, 1) both;
    }

    #ground {
      transform-origin: 1110px 682px;
      animation: ground-arrive 850ms cubic-bezier(.22, 1, .36, 1) 120ms both;
    }

    #rear-wing {
      animation: plane-arrive 720ms cubic-bezier(.22, 1, .36, 1) 220ms both;
    }

    #front-wing {
      animation: plane-arrive 720ms cubic-bezier(.22, 1, .36, 1) 360ms both;
    }

    #entrance-canopy {
      animation: canopy-arrive 620ms cubic-bezier(.22, 1, .36, 1) 560ms both;
    }

    .panel-module {
      animation: panel-arrive 640ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .panel-module:nth-child(1) { animation-delay: 720ms; }
    .panel-module:nth-child(2) { animation-delay: 780ms; }
    .panel-module:nth-child(3) { animation-delay: 840ms; }
    .panel-module:nth-child(4) { animation-delay: 900ms; }
    .panel-module:nth-child(5) { animation-delay: 960ms; }
    .panel-module:nth-child(6) { animation-delay: 1020ms; }

    #array-glint {
      animation: glint-pass 8s cubic-bezier(.4, 0, .2, 1) 2s infinite;
    }

    @keyframes sun-arrive {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes ground-arrive {
      from { opacity: 0; transform: scaleX(.86); }
      to { opacity: 1; transform: scaleX(1); }
    }

    @keyframes plane-arrive {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes canopy-arrive {
      from { opacity: 0; transform: translateY(-9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes panel-arrive {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glint-pass {
      0%, 68% { opacity: 0; transform: translateX(-190px); }
      74% { opacity: .62; }
      84%, 100% { opacity: 0; transform: translateX(590px); }
    }

    @media (prefers-reduced-motion: reduce) {
      #sun-field,
      #ground,
      #rear-wing,
      #front-wing,
      #entrance-canopy,
      .panel-module,
      #array-glint {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <g id="sun-field">
    <circle cx="1270" cy="225" r="224" fill="url(#sun-core)"/>
    <circle
      cx="1270"
      cy="225"
      r="292"
      fill="url(#sun-grain)"
      mask="url(#grain-mask)"
      opacity=".76"
    />
  </g>

  <g id="ground">
    <ellipse cx="1090" cy="684" rx="474" ry="52" fill="#1e4772" opacity=".12"/>
    <ellipse cx="1135" cy="675" rx="342" ry="31" fill="#071b32" opacity=".11"/>
  </g>

  <g id="home" filter="url(#home-shadow)">
    <g id="rear-wing">
      <path
        d="M654 411L1136 290L1480 408L984 539Z"
        fill="url(#roof-main)"
      />
      <path
        d="M984 539L1480 408V594L984 730Z"
        fill="url(#wall-main)"
      />
      <path
        d="M654 411L984 539V730L654 601Z"
        fill="url(#wall-light)"
      />

      <path
        d="M1053 555L1419 458V548L1053 649Z"
        fill="#06192f"
      />
      <path
        d="M1065 559L1172 531V614L1065 643Z"
        fill="url(#glass)"
      />
      <path
        d="M1184 528L1291 499V581L1184 611Z"
        fill="url(#glass)"
      />
      <path
        d="M1303 496L1407 469V551L1303 579Z"
        fill="url(#glass)"
      />

      <path
        d="M1035 536L1441 428"
        fill="none"
        stroke="#faf8ef"
        stroke-width="7"
        opacity=".82"
      />
    </g>

    <g id="front-wing">
      <path
        d="M560 504L913 416L1164 503L801 599Z"
        fill="#f7f3e8"
      />
      <path
        d="M801 599L1164 503V645L801 744Z"
        fill="url(#wall-light)"
      />
      <path
        d="M560 504L801 599V744L560 649Z"
        fill="#f2eee4"
      />

      <path
        d="M880 603L1055 557V651L880 699Z"
        fill="#071a32"
      />
      <path
        d="M892 606L1043 566V643L892 684Z"
        fill="url(#glass)"
      />
    </g>

    <g id="entrance">
      <path d="M773 566L851 545V697L773 718Z" fill="#0e2820"/>
      <path d="M785 581L839 566V675L785 690Z" fill="#17372d"/>
      <circle cx="827" cy="638" r="4.5" fill="#f2c85d"/>
    </g>

    <g id="entrance-canopy" filter="url(#small-shadow)">
      <path
        d="M730 540L872 504L944 529L799 568Z"
        fill="#122b48"
      />
      <path
        d="M799 568L944 529V543L799 583Z"
        fill="#071a30"
      />
    </g>

    <g id="solar-array" transform="translate(786 327)">
      <path
        d="M-16 41L465 -6L556 77L74 134Z"
        fill="#0b1d32"
        opacity=".18"
        transform="translate(8 9)"
      />

      <g class="panel-module" transform="translate(0 0)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>
      <g class="panel-module" transform="translate(151 -15)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>
      <g class="panel-module" transform="translate(302 -30)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>
      <g class="panel-module" transform="translate(38 45)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>
      <g class="panel-module" transform="translate(189 30)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>
      <g class="panel-module" transform="translate(340 15)">
        <path d="M0 44L142 30L179 65L36 81Z" fill="url(#panel-blue)" stroke="#b6d9fb" stroke-width="3"/>
        <path d="M46 40L58 76M94 35L106 71M142 31L154 66M18 61L160 46" fill="none" stroke="#8dc5f7" stroke-width="1" opacity=".56"/>
      </g>

      <g clip-path="url(#array-clip)">
        <rect
          id="array-glint"
          x="-180"
          y="-30"
          width="120"
          height="200"
          fill="url(#panel-glint)"
          transform="rotate(-8)"
        />
      </g>
    </g>
  </g>
</svg>
